# The active gfx1151 rocprofv3 installation exposes no public wave-wait
# counter. Collect the four public diagnostics here; profile-wait collects
# SQ_WAIT_ANY separately through rocprof-compute on the default GPU queue.
jobs:
  - pmc:
      - SQ_INSTS_VALU
    kernel_include_regex: ".*(relax_light_edges_kernel|relax_heavy_edges_kernel|cooperative_delta_controller_kernel|reset_.*touched_vertices_kernel|materialize_predecessors_kernel|measure_edge_parent_target_paths_kernel|fill_edge_parent_target_paths_kernel|clear_flags_from_queue_kernel|clear_workspace_kernel|seed_sources_kernel|relax_frontier_kernel|update_target_status_kernel|summarize_target_paths_kernel|materialize_target_paths_kernel).*"
  - pmc:
      - MeanOccupancyPerActiveCU
    kernel_include_regex: ".*(relax_light_edges_kernel|relax_heavy_edges_kernel|cooperative_delta_controller_kernel|reset_.*touched_vertices_kernel|materialize_predecessors_kernel|measure_edge_parent_target_paths_kernel|fill_edge_parent_target_paths_kernel|clear_flags_from_queue_kernel|clear_workspace_kernel|seed_sources_kernel|relax_frontier_kernel|update_target_status_kernel|summarize_target_paths_kernel|materialize_target_paths_kernel).*"
  - pmc:
      - L2CacheHit
    kernel_include_regex: ".*(relax_light_edges_kernel|relax_heavy_edges_kernel|cooperative_delta_controller_kernel|reset_.*touched_vertices_kernel|materialize_predecessors_kernel|measure_edge_parent_target_paths_kernel|fill_edge_parent_target_paths_kernel|clear_flags_from_queue_kernel|clear_workspace_kernel|seed_sources_kernel|relax_frontier_kernel|update_target_status_kernel|summarize_target_paths_kernel|materialize_target_paths_kernel).*"
  - pmc:
      - SQ_WAVE_CYCLES
    kernel_include_regex: ".*(relax_light_edges_kernel|relax_heavy_edges_kernel|cooperative_delta_controller_kernel|reset_.*touched_vertices_kernel|materialize_predecessors_kernel|measure_edge_parent_target_paths_kernel|fill_edge_parent_target_paths_kernel|clear_flags_from_queue_kernel|clear_workspace_kernel|seed_sources_kernel|relax_frontier_kernel|update_target_status_kernel|summarize_target_paths_kernel|materialize_target_paths_kernel).*"
