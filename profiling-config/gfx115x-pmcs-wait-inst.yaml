# Use SQ_WAIT_INST_ANY when the active gfx115x rocprofv3 installation does not
# expose SQ_WAIT_ANY. Every metric or SQ event remains in its own replay job.
jobs:
  - pmc:
      - SQ_INSTS_VALU
    kernel_include_regex: ".*(relax_light_edges_kernel|relax_heavy_edges_kernel|cooperative_delta_controller_kernel|reset_.*touched_vertices_kernel|materialize_predecessors_kernel|measure_edge_parent_target_paths_kernel|fill_edge_parent_target_paths_kernel|clear_flags_from_queue_kernel).*"
  - pmc:
      - MeanOccupancyPerActiveCU
    kernel_include_regex: ".*(relax_light_edges_kernel|relax_heavy_edges_kernel|cooperative_delta_controller_kernel|reset_.*touched_vertices_kernel|materialize_predecessors_kernel|measure_edge_parent_target_paths_kernel|fill_edge_parent_target_paths_kernel|clear_flags_from_queue_kernel).*"
  - pmc:
      - L2CacheHit
    kernel_include_regex: ".*(relax_light_edges_kernel|relax_heavy_edges_kernel|cooperative_delta_controller_kernel|reset_.*touched_vertices_kernel|materialize_predecessors_kernel|measure_edge_parent_target_paths_kernel|fill_edge_parent_target_paths_kernel|clear_flags_from_queue_kernel).*"
  - pmc:
      - SQ_WAIT_INST_ANY
    kernel_include_regex: ".*(relax_light_edges_kernel|relax_heavy_edges_kernel|cooperative_delta_controller_kernel|reset_.*touched_vertices_kernel|materialize_predecessors_kernel|measure_edge_parent_target_paths_kernel|fill_edge_parent_target_paths_kernel|clear_flags_from_queue_kernel).*"
  - pmc:
      - SQ_WAVE_CYCLES
    kernel_include_regex: ".*(relax_light_edges_kernel|relax_heavy_edges_kernel|cooperative_delta_controller_kernel|reset_.*touched_vertices_kernel|materialize_predecessors_kernel|measure_edge_parent_target_paths_kernel|fill_edge_parent_target_paths_kernel|clear_flags_from_queue_kernel).*"
